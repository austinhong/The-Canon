<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Canon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="camera" hidden>
    <video id="cam-video" playsinline autoplay muted></video>
    <div class="cam-actions">
      <button id="cam-capture" type="button">Take the photo</button>
      <button id="cam-cancel" class="ghost" type="button">Cancel</button>
    </div>
    <p>This uses the camera right now. A photo from your gallery cannot be submitted.</p>
  </div>
  <main id="app"></main>
  <script src="canon.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
